---
# The inventory group containing every host to link. zabbix_agents already
# includes its hypervisors/container_hosts children automatically (a child
# group's hosts count as members of the parent too), so this one group
# name covers every monitored host regardless of subgroup.
zabbix_link_target_group: zabbix_agents

# Zabbix host group every linked host is placed into. Independent of each
# template's own template_groups field (Linux servers / Scope Templates /
# Hypervisors, which varies per template) - that's UI categorization for
# templates, unrelated to which Zabbix host group an actual host sits in.
zabbix_host_group: "Linux servers"
