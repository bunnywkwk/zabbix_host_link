#SPDX-License-Identifier: MIT-0
galaxy_info:
  author: bunnywkwk
  description: Links each monitored host to the Zabbix template(s) matching its assigned requirement clusters, via the Zabbix HTTP API.

  license: MIT-0

  min_ansible_version: "2.14"

  galaxy_tags:
    - zabbix
    - monitoring
    - rhel

dependencies: []
  # No other Ansible roles required.
  #
  # This role does depend on the community.zabbix collection (for the
  # zabbix_host module used in tasks/main.yml) - not expressible here,
  # same reason as zabbix_template_deploy: this `dependencies:` field
  # only resolves other Galaxy roles, not collections. Tracked in the
  # playbook-level requirements.yml instead.
